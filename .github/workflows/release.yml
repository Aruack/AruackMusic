name: Build & Publish Release Assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Verify Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Create local.properties & Keystore
        run: |
          echo "JAMENDO_CLIENT_ID=${{ secrets.JAMENDO_CLIENT_ID || '84ce12ad' }}" >> local.properties
          echo "SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID || 'ff184412120343ada935dbdbaf205475' }}" >> local.properties
          mkdir -p app/keystore
          keytool -genkeypair -v -keystore app/keystore/release.keystore -alias aruackrelease -keyalg RSA -keysize 2048 -validity 10000 -storepass aruackmusic2024 -keypass aruackmusic2024 -dname "CN=Aruack Music, OU=Mobile, O=ARUACK, L=Worldwide, ST=State, C=US"

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          TAG="${{ github.ref_name || inputs.release_tag }}"
          cp app/build/outputs/apk/release/app-release.apk "release_assets/Aruack-Music-${TAG}.apk"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aruack-Music-Release-Assets
          path: release_assets/*

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || inputs.release_tag }}
          name: Aruack Music ${{ github.ref_name || inputs.release_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/*.apk
