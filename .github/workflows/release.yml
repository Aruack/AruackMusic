name: Build & Publish Release Assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Flashable Zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Create local.properties
        run: |
          echo "JAMENDO_CLIENT_ID=${{ secrets.JAMENDO_CLIENT_ID || '84ce12ad' }}" >> local.properties

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Assets (APK & Magisk/Recovery ZIP)
        run: |
          mkdir -p release_assets
          TAG="${{ github.ref_name || inputs.release_tag }}"
          
          # Copy Standalone APK
          cp app/build/outputs/apk/release/app-release.apk "release_assets/Aruack-Music-${TAG}.apk"
          
          # Build Flashable Magisk & Recovery ZIP
          mkdir -p magisk_module/system/priv-app/AruackMusic
          cp app/build/outputs/apk/release/app-release.apk magisk_module/system/priv-app/AruackMusic/AruackMusic.apk
          cd magisk_module
          zip -r "../release_assets/Aruack-Music-${TAG}-Magisk-Recovery.zip" *
          cd ..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aruack-Music-Release-Assets
          path: release_assets/*

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || inputs.release_tag }}
          name: Aruack Music ${{ github.ref_name || inputs.release_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/*.apk
            release_assets/*.zip
